# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version: 4

enable_cursor_positioning: true

transient_prompt:
  foreground: '#555555'
  background: transparent
  template: "> "

blocks:
    -
      type: prompt
      alignment: left
      newline: true
      segments:
        -
          type: status
          template: '<b><i>┌─</i></b>'
          style: plain
          foreground: '#555555'
          foreground_templates:
            - '{{ if gt .Code 0 }}red{{ end }}'
          options:
            always_enabled: true

        -
          type: os
          template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
          style: powerline
          foreground: '#FFFFFF'
          background: '#0F1419'
          powerline_symbol: 
          invert_powerline: true
          properties:
            macos: ''

        -
          type: text
          template: '<b><i>  </i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'

        -
          type: path
          template: '<b><i>{{ .Path }}</i></b>'
          style: powerline
          background: '#0F1419'
          options:
            style: powerlevel
            cycle: [blue, white]

        -
          type: text
          template: '<b><i> </i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'

        -
          type: git
          template: "<b><i>\
            {{ if .Ref }} \
            {{ .HEAD }}\
            {{if .BranchStatus }} {{ .BranchStatus }}{{ end }}\
            {{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}\
            {{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}\
            {{ if .Working.Changed }}  {{ .Working.String }}{{ end }} \
            {{ else }}<d></d>{{ end }}</i></b>"
          style: powerline
          foreground: '#AAD94C'
          foreground_templates:
            - '{{ if .Working.Changed }}#FFB454{{end}}'
          background: '#0F1419'
          powerline_symbol: 
          options:
            fetch_status: true
            branch_icon: ' '

    -
      type: prompt
      alignment: right
      segments:
        -
          type: executiontime
          template: '<b><i>{{ .FormattedMs }}</i></b>'
          style: powerline
          foreground: '#AAD94C'
          background: '#0F1419'
          powerline_symbol: 
          leading_powerline_symbol: 
          invert_powerline: true
          options:
            always_enabled: false
            threshold: 0
            style: austin

        -
          type: text
          template: '<b><i>{{ if .Segments.Node.Full }}{{ end }}</i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'
        -
          type: node
          template: '<b><i>  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} </i></b>'
          style: powerline
          foreground: '#59C2FF'
          background: '#0F1419'

        -
          type: text
          template: '<b><i>{{ if .Segments.Rust.Full }}{{ end }}</i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'
        -
          type: rust
          template: '<b><i>  {{ .Full }} </i></b>'
          style: powerline
          foreground: '#F28779'
          background: '#0F1419'

        # -
        #   type: kotlin
        #   template: "  {{ .Full }} "
        #   style: powerline
        #   foreground: '#89b4fa'
        #   background: '0'

        -
          type: text
          template: '<b><i>{{ if .Segments.Python.Venv }}{{ end }}</i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'
        -
          type: python
          template: '<b><i>  {{ .Venv }} </i></b>'
          style: plain
          foreground: '#DFBFFF'
          background: '#0F1419'
          powerline_symbol: 
          leading_powerline_symbol: 
          invert_powerline: true
          options:
            display_mode: context
            fetch_virtual_env: true

        -
          type: text
          template: '<b><i></i></b>'
          style: powerline
          foreground: '#555555'
          background: '#0F1419'

        -
          template: '<b><i>{{ .CurrentDate | date .Format }} </i></b>'
          type: time
          style: powerline
          foreground: '#AAD94C'
          background: '#0F1419'
          powerline_symbol: 

    -
      type: prompt
      alignment: left
      newline: true
      segments:
        -
          options:
            always_enabled: true
          # template: '➜ '
          template: '<b><i>└─ </i></b>'
          foreground: '#555555'
          type: status
          style: powerline
          foreground_templates:
            - '{{ if gt .Code 0 }}red{{ end }}'
