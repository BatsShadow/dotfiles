# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version: 4

enable_cursor_positioning: true

transient_prompt:
  foreground: '#555555'
  background: transparent
  template: "> "

blocks:
    -
      type: prompt
      alignment: left
      newline: true
      segments:
        -
          type: status
          template: '┌─'
          style: plain
          foreground: '#555555'
          foreground_templates:
            - '{{ if gt .Code 0 }}red{{ end }}'
          options:
            always_enabled: true

        -
          type: os
          template: ' {{ if .WSL }}WSL at {{ end }}{{.Icon}}'
          style: powerline
          foreground: '#FFFFFF'
          background: '0'
          powerline_symbol: 
          invert_powerline: true

        -
          type: text
          template: '  '
          style: powerline
          foreground: '#555555'
          background: '0'

        -
          type: path
          template: '<b>{{ .Path }}</b>'
          style: powerline
          background: '0'
          options:
            style: powerlevel
            cycle: [blue, white]

        -
          type: text
          template: '  '
          style: powerline
          foreground: '#555555'
          background: '0'

        -
          type: git
          template: "\
            {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}\
            {{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}\
            {{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}\
            {{ if .Working.Changed }}  {{ .Working.String }}{{ end }} "
          style: powerline
          foreground: '#fab387'
          background: '0'
          powerline_symbol: 
          options:
            fetch_status: true
            branch_icon: ' '

    -
      type: prompt
      alignment: right
      segments:
        -
          type: executiontime
          style: powerline
          foreground: '#a6e3a1'
          background: '0'
          powerline_symbol: 
          leading_powerline_symbol: 
          invert_powerline: true
          options:
            always_enabled: false
            threshold: 0
            style: austin

        -
          type: text
          template: ''
          style: powerline
          foreground: '#555555'
          background: '0'
        -
          type: node
          template: '  {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} '
          style: powerline
          foreground: '#74c7ec'
          background: '0'

        -
          type: rust
          template: '  {{ .Full }} '
          style: powerline
          foreground: '#f38ba8'
          background: '0'

        # -
        #   type: kotlin
        #   template: "  {{ .Full }} "
        #   style: powerline
        #   foreground: '#89b4fa'
        #   background: '0'

        -
          type: python
          template: '  {{ .Venv }} '
          style: plain
          foreground: '#cba6f7'
          background: '0'
          powerline_symbol: 
          leading_powerline_symbol: 
          invert_powerline: true
          options:
            display_mode: context
            fetch_virtual_env: true

        -
          type: text
          template: ''
          style: powerline
          foreground: '#555555'
          background: '0'

        -
          template: '{{ .CurrentDate | date .Format }} '
          type: time
          style: powerline
          foreground: '#a6e3a1'
          background: '0'
          powerline_symbol: 

    -
      type: prompt
      alignment: left
      newline: true
      segments:
        -
          options:
            always_enabled: true
          # template: '➜ '
          template: '└─ '
          foreground: '#555555'
          type: status
          style: powerline
          foreground_templates:
            - '{{ if gt .Code 0 }}red{{ end }}'
