# Auto-workspaces for windows
# v2 syntax: `if = 'test %{...}'` (dot-notation `if.app-id` is soft-deprecated).
# && = AND, ~= = case-insensitive regex-substring. Order matters: first match wins.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.github.wez.wezterm'
run = "move-node-to-workspace Terminal"

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.iCal'
run = "move-node-to-workspace Calendar"

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.hnc.Discord'
run = "move-node-to-workspace Discord"

[[on-window-detected]] # Arc / Gmail
if = 'test %{app-bundle-id} = company.thebrowser.Browser && test %{window-title} ~= Gmail'
run = "move-node-to-workspace Email"

[[on-window-detected]] # Arc / Messages for web
if = 'test %{app-bundle-id} = company.thebrowser.Browser && test %{window-title} ~= Messages'
run = "move-node-to-workspace Email"

[[on-window-detected]] # Arc / YouTube
if = 'test %{app-bundle-id} = company.thebrowser.Browser && test %{window-title} ~= YouTube'
run = "move-node-to-workspace YouTube"

[[on-window-detected]] # Arc (generic)
if = 'test %{app-bundle-id} = company.thebrowser.Browser'
run = "move-node-to-workspace Browser"

[[on-window-detected]] # Safari — its own workspace (alt-period), not grouped with Arc
if = 'test %{app-bundle-id} = com.apple.Safari'
run = "move-node-to-workspace Safari"

[[on-window-detected]] # Slack
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = "move-node-to-workspace Slack"

[[on-window-detected]]
if = 'test %{app-bundle-id} = md.obsidian'
run = "move-node-to-workspace Email"

[[on-window-detected]] # Zoom — its own workspace (alt-comma), not grouped with Slack
if = 'test %{app-bundle-id} = us.zoom.xos'
run = "move-node-to-workspace Zoom"

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brnbw.Tuna'
run = "layout floating"

[[on-window-detected]]
if = 'test %{app-bundle-id} = roomeqwizard.launcher'
run = "layout floating"

# 'main' binding mode declaration
[mode.main.binding]

cmd-m = []

# Layout toggles — free-form tiling lives here (tile mode disables both: they
# would break its canonical Stage | Rail tree). Both now sit on slash, which
# frees alt-comma to be the Zoom app key in tile mode without the two modes
# disagreeing about what comma means.
alt-slash = 'layout tiles accordion'
alt-shift-slash = 'layout horizontal vertical'

# Focus (Colemak-DH: m=left, n=down, e=up, i=right)
alt-m = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

# Move windows
alt-shift-m = 'move left'
alt-shift-n = 'move down'
alt-shift-e = 'move up'
alt-shift-i = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Gap/layout modes — number row
alt-0 = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'
alt-4 = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'

alt-1 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 1',
  'layout accordion horizontal',
]
alt-2 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 2',
  'layout tiles horizontal',
]
alt-3 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 3',
  'layout tiles horizontal',
]

# Gap/layout modes — left-hand homerow (Colemak-DH: t s r a)
alt-t = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 1',
  'layout accordion horizontal',
]
alt-s = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 2',
  'layout tiles horizontal',
]
alt-r = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 3',
  'layout tiles horizontal',
]
alt-a = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'
# Push the whole workspace to the next monitor (same finger as tile mode's Aux
# stash — "send it to the other screen"). Replaces alt-shift-tab.
alt-shift-a = 'move-workspace-to-monitor --wrap-around next'

# Utility workspaces
alt-7 = [
  'workspace 7',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-8 = [
  'workspace 8',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-9 = [
  'workspace 9',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-shift-7 = [
  'move-node-to-workspace 7',
  'workspace 7',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]
alt-shift-8 = [
  'move-node-to-workspace 8',
  'workspace 8',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]
alt-shift-9 = [
  'move-node-to-workspace 9',
  'workspace 9',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-z = [
  'workspace Z',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-shift-z = [
  'move-node-to-workspace Z',
  'workspace Z',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

# Named Workspaces — right hand only (Colemak-DH)
# Use dispatcher for launch-if-not-running and on-focus behavior
alt-u = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.github.wez.wezterm --app-name WezTerm --workspace Terminal'
alt-shift-u = [
  'move-node-to-workspace Terminal',
  'workspace Terminal',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-o = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --workspace Browser'
alt-shift-o = [
  'move-node-to-workspace Browser',
  'workspace Browser',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-l = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --workspace Email --on-focus /Users/scott/.config/aerospace/toggle-email-pin.sh'
alt-shift-l = [
  'move-node-to-workspace Email',
  'workspace Email',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-h = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.tinyspeck.slackmacgap --app-name Slack --workspace Slack'
alt-shift-h = [
  'move-node-to-workspace Slack',
  'workspace Slack',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-semicolon = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.hnc.Discord --app-name Discord --workspace Discord'
alt-shift-semicolon = [
  'move-node-to-workspace Discord',
  'workspace Discord',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-c = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.apple.iCal --app-name Calendar --workspace Calendar --on-focus /Users/scott/.config/aerospace/open-calendar.sh'
alt-shift-c = [
  'move-node-to-workspace Calendar',
  'workspace Calendar',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

# Zoom (alt-comma) and Safari (alt-period) — same keys as tile mode, so the two
# modes agree: `,` = Zoom, `.` = Safari. Both are right-hand keys, held with the
# left-r alt home-row mod (see STAGE-RAIL-DESIGN.md "The hand rule").
alt-comma = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id us.zoom.xos --app-name zoom.us --workspace Zoom'
alt-shift-comma = [
  'move-node-to-workspace Zoom',
  'workspace Zoom',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-period = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.apple.Safari --app-name Safari --workspace Safari'
alt-shift-period = [
  'move-node-to-workspace Safari',
  'workspace Safari',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-p = [
  'workspace Browser',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
  '''exec-and-forget osascript -e '
  tell application "Arc"
    tell front window
      tell space "Work"
        tell first tab whose name is "PRs" to select
      end tell
    end tell
    activate
  end tell
  '
  ''',
]

