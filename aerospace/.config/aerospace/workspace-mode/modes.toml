alt-y = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --workspace YouTube --on-focus "osascript /Users/scott/.config/aerospace/arc-select-tab.scpt 3 1"'
alt-shift-y = [
  'move-node-to-workspace YouTube',
  'workspace YouTube',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

# Toggle to tile mode
alt-shift-q = 'exec-and-forget /Users/scott/.config/aerospace/toggle-mode.sh'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Service mode
alt-shift-quote = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
forwardDelete = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-m = ['join-with left', 'mode main']
alt-shift-n = ['join-with down', 'mode main']
alt-shift-e = ['join-with up', 'mode main']
alt-shift-i = ['join-with right', 'mode main']
