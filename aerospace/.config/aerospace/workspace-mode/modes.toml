# Auto-workspaces for windows
[[on-window-detected]]
if.app-id = "com.github.wez.wezterm"
run = "move-node-to-workspace Terminal"

[[on-window-detected]]
if.app-id = "com.apple.iCal"
run = "move-node-to-workspace Calendar"

[[on-window-detected]]
if.app-id = "com.hnc.Discord"
run = "move-node-to-workspace Discord"

[[on-window-detected]]
if.app-id = "company.thebrowser.Browser"  # Arc
if.window-title-regex-substring = "Gmail"
run = "move-node-to-workspace Email"

[[on-window-detected]]
if.app-id = "company.thebrowser.Browser"             # Arc
if.window-title-regex-substring = "Messages for web"
run = "move-node-to-workspace Email"

[[on-window-detected]]
if.app-id = "company.thebrowser.Browser"      # Arc
if.window-title-regex-substring = ".*YouTube"
run = "move-node-to-workspace YouTube"

[[on-window-detected]]
if.app-id = "company.thebrowser.Browser"
run = "move-node-to-workspace Browser"

[[on-window-detected]]
if.app-id = "com.apple.Safari"
run = "move-node-to-workspace Browser"

[[on-window-detected]]
if.app-id = "com.tinyspeck.slackmacgap" # Slack
run = "move-node-to-workspace Slack"

[[on-window-detected]]
if.app-id = "md.obsidian"
run = "move-node-to-workspace Email"

[[on-window-detected]]
if.app-id = "us.zoom.xos"        # Zoom
run = "move-node-to-workspace Slack"

[[on-window-detected]]
if.app-id = "com.brnbw.Tuna"
run = "layout floating"

# 'main' binding mode declaration
[mode.main.binding]

cmd-m = []

# Layout toggles
alt-slash = 'layout tiles accordion'
alt-comma = 'layout horizontal vertical'

# Focus (Colemak-DH: m=left, n=down, e=up, i=right)
alt-m = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

# Move windows
alt-shift-m = 'move left'
alt-shift-n = 'move down'
alt-shift-e = 'move up'
alt-shift-i = 'move right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Gap/layout modes — number row
alt-0 = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'
alt-4 = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'

alt-1 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 1',
  'layout accordion horizontal',
]
alt-2 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 2',
  'layout tiles horizontal',
]
alt-3 = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 3',
  'layout tiles horizontal',
]

# Gap/layout modes — left-hand homerow (Colemak-DH: a r s t)
alt-a = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 1',
  'layout accordion horizontal',
]
alt-r = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 2',
  'layout tiles horizontal',
]
alt-s = [
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh 3',
  'layout tiles horizontal',
]
alt-t = 'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh'

# Utility workspaces
alt-7 = [
  'workspace 7',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-8 = [
  'workspace 8',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-9 = [
  'workspace 9',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-shift-7 = [
  'move-node-to-workspace 7',
  'workspace 7',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]
alt-shift-8 = [
  'move-node-to-workspace 8',
  'workspace 8',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]
alt-shift-9 = [
  'move-node-to-workspace 9',
  'workspace 9',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-z = [
  'workspace Z',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]
alt-shift-z = [
  'move-node-to-workspace Z',
  'workspace Z',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

# Named Workspaces — right hand only (Colemak-DH)
# Use dispatcher for launch-if-not-running and on-focus behavior
alt-u = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.github.wez.wezterm --app-name WezTerm --workspace Terminal'
alt-shift-u = [
  'move-node-to-workspace Terminal',
  'workspace Terminal',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-o = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --workspace Browser'
alt-shift-o = [
  'move-node-to-workspace Browser',
  'workspace Browser',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-l = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --workspace Email --on-focus /Users/scott/.config/aerospace/toggle-email-pin.sh'
alt-shift-l = [
  'move-node-to-workspace Email',
  'workspace Email',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-h = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.tinyspeck.slackmacgap --app-name Slack --workspace Slack'
alt-shift-h = [
  'move-node-to-workspace Slack',
  'workspace Slack',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-semicolon = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.hnc.Discord --app-name Discord --workspace Discord'
alt-shift-semicolon = [
  'move-node-to-workspace Discord',
  'workspace Discord',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-c = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.apple.iCal --app-name Calendar --workspace Calendar --on-focus /Users/scott/.config/aerospace/open-calendar.sh'
alt-shift-c = [
  'move-node-to-workspace Calendar',
  'workspace Calendar',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh',
]

alt-p = [
  'workspace Browser',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
  '''exec-and-forget osascript -e '
  tell application "Arc"
    tell front window
      tell space "Work"
        tell first tab whose name is "PRs" to select
      end tell
    end tell
    activate
  end tell
  '
  ''',
]

