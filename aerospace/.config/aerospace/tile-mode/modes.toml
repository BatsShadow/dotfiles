[[on-window-detected]]
run = "move-node-to-workspace Tiles"

# 'main' binding mode declaration
[mode.main.binding]

cmd-m = []

# Layout toggles
alt-slash = 'layout tiles accordion'
alt-comma = 'layout horizontal vertical'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Focus (Colemak-DH: m=left, n=down, e=up, i=right)
alt-m = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

# Swap focused window left
alt-f = 'swap left'

# App switching — right hand only (Colemak-DH)
alt-u = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.github.wez.wezterm --app-name WezTerm --find-args "--all app-name"'
alt-o = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --find-args "--all app-name"'
alt-l = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --find-title Gmail'
alt-h = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.tinyspeck.slackmacgap --app-name Slack --find-args "--all app-name"'
alt-semicolon = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.hnc.Discord --app-name Discord --find-args "--all app-name"'
alt-y = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id company.thebrowser.Browser --app-name Arc --find-title YouTube'
alt-c = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id com.apple.iCal --app-name Calendar --find-args "--all app-name" --on-focus /Users/scott/.config/aerospace/open-calendar.sh'
alt-z = 'exec-and-forget /Users/scott/.config/aerospace/dispatch.sh --app-id us.zoom.xos --app-name zoom.us --find-args "--all app-name"'

# alt-a, alt-s, alt-d, alt-g are free in tile mode (used for gap modes in workspace mode)

# Toggle to workspace mode
alt-shift-q = 'exec-and-forget /Users/scott/.config/aerospace/toggle-mode.sh'

# # monkeytype (commented out — was alt-t)
