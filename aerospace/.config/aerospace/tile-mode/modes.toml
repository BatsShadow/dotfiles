[[on-window-detected]]
run = "move-node-to-workspace Tiles"

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# alt-enter = '''exec-and-forget osascript -e '
# tell application "Terminal"
#     do script
#     activate
# end tell'
# '''

cmd-m = []

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles accordion'
alt-comma = 'layout horizontal vertical'
# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-f = 'swap left'
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-t = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh WezTerm --all app-name'
alt-i = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh WezTerm --all app-name'

alt-a = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Arc --all app-name'
alt-n = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Arc --all app-name'

alt-e = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Gmail'
alt-u = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Gmail'

alt-s = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Slack'
alt-m = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Slack'

alt-d = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Discord --all app-name'

alt-z = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/split-focus.aerospace.sh Zoom'

alt-shift-q = [
  'workspace M',
  'exec-and-forget /Users/scott/.config/aerospace/workspace-mode/auto-config.aerospace.sh W',
]

