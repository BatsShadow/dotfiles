# v2 syntax: `if = 'test %{...}'` (dot-notation `if.app-id` is soft-deprecated).
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.brnbw.Tuna'
run = "layout floating"

[[on-window-detected]]
if = 'test %{app-bundle-id} = roomeqwizard.launcher'
run = "layout floating"

# Catch-all: everything else lands on the Tiles workspace
[[on-window-detected]]
if = 'true'
run = "move-node-to-workspace Tiles"

# 'main' binding mode declaration
[mode.main.binding]

cmd-m = []

# Layout toggles
alt-slash = 'layout tiles accordion'
alt-comma = 'layout horizontal vertical'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Focus (Colemak-DH: m=left, n=down, e=up, i=right)
alt-m = 'focus left'
alt-n = 'focus down'
alt-e = 'focus up'
alt-i = 'focus right'

# Move/swap windows (Colemak-DH)
alt-shift-m = 'swap left'
alt-shift-n = 'swap down'
alt-shift-e = 'swap up'
alt-shift-i = 'swap right'

# Narrow / widen the XDR outer gaps together (master shifts, accordion resizes)
alt-w = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/resize-gap.sh narrow'
alt-f = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/resize-gap.sh widen'

# App keys (Look) — right hand (Colemak-DH). PURE FOCUS: raise/focus the app
# wherever it lives (a Rail window rises to the accordion front; a match on the
# built-in is focused there in place). Never mutates the layout.
alt-u = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id com.github.wez.wezterm --app-name WezTerm'
alt-o = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id company.thebrowser.Browser --app-name Arc --exclude "Gmail|YouTube|Messages"'
alt-l = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id company.thebrowser.Browser --app-name Arc --find-title "Gmail|Messages" --on-focus /Users/scott/.config/aerospace/toggle-email-pin.sh'
alt-h = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id com.tinyspeck.slackmacgap --app-name Slack'
alt-semicolon = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id com.hnc.Discord --app-name Discord'
alt-y = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id company.thebrowser.Browser --app-name Arc --find-title YouTube --on-focus "osascript /Users/scott/.config/aerospace/arc-select-tab.scpt 3 1"'
alt-c = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id com.apple.iCal --app-name Calendar --on-focus /Users/scott/.config/aerospace/open-calendar.sh'
alt-z = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --app-id us.zoom.xos --app-name zoom.us'

# Stage keys (alt-shift + app key) — swap that app onto the Stage (the deliberate
# "make this my primary surface" verb). Same matching as the Look keys, plus
# --stage; focus follows. alt-shift-t stages whatever is focused.
alt-shift-u = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id com.github.wez.wezterm --app-name WezTerm'
alt-shift-o = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id company.thebrowser.Browser --app-name Arc --exclude "Gmail|YouTube|Messages"'
alt-shift-l = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id company.thebrowser.Browser --app-name Arc --find-title "Gmail|Messages"'
alt-shift-h = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id com.tinyspeck.slackmacgap --app-name Slack'
alt-shift-semicolon = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id com.hnc.Discord --app-name Discord'
alt-shift-y = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id company.thebrowser.Browser --app-name Arc --find-title YouTube'
alt-shift-c = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id com.apple.iCal --app-name Calendar'
alt-shift-z = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/app.sh --stage --app-id us.zoom.xos --app-name zoom.us'

# Left hand — A R S T (physical left-to-right)
alt-a = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/focus-monitor.sh secondary'  # Look at Aux (built-in / far-left)
alt-r = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/resize-master.sh shrink'      # rebalance: Stage smaller / Rail wider
alt-s = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/resize-master.sh grow'        # rebalance: Stage bigger / Rail narrower
alt-t = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/focus-monitor.sh primary'     # Look at Stage (focus the master)

# alt-shift-a: Aux stash toggle (empty -> pin focused; occupied -> evict to Rail)
alt-shift-a = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/aux-toggle.sh'
# alt-shift-t: Stage the focused window (generic, attention-addressed staging)
alt-shift-t = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/promote.sh'

# Repair / re-apply the tile layout
alt-0 = 'exec-and-forget /Users/scott/.config/aerospace/tile-mode/relayout.sh'

# Toggle to workspace mode
alt-shift-q = 'exec-and-forget /Users/scott/.config/aerospace/toggle-mode.sh'

alt-tab = 'workspace-back-and-forth'

# Service mode
alt-shift-quote = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
