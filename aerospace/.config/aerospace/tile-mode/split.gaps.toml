
# TILE-MODE gaps.
# Master is anchored to the LEFT, so the old 710px left-centering margin is gone.
# Small outer margins frame the content near full-screen; inner gaps separate the
# master from the right column (horizontal) and the stacked windows (vertical).
[gaps]
outer.left = [{ monitor.built-in = 8 }, { monitor.XDR = 10 }, 8]
outer.right = [{ monitor.built-in = 8 }, { monitor.XDR = 10 }, 8]
outer.bottom = [{ monitor.built-in = 8 }, { monitor.XDR = 60 }, 8]
outer.top = [{ monitor.built-in = 8 }, { monitor.XDR = 40 }, 8]
inner.horizontal = 10
inner.vertical = 10
